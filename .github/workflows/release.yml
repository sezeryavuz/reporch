# Release pipeline for reporch.
#
# AUTHORED BUT NEVER EXECUTED. No release has been cut, nothing has been published to crates.io,
# npm, or a Homebrew tap, and no tag has been pushed. Running this is a deliberate human act.
#
# Normally this file is GENERATED by `dist init` / `dist generate` from the
# [workspace.metadata.dist] table in Cargo.toml. It is written out here so the pipeline is
# reviewable in the repository before anyone installs cargo-dist. Regenerate with:
#
#     cargo install cargo-dist
#     dist init --yes && dist generate
#
# and commit the diff.
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      # cargo-dist's tag convention. `v0.1.0` releases the whole workspace.
      - "**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A release build that emits a warning is a release that should not ship.
  RUSTFLAGS: "-D warnings"

jobs:
  # Gate: never publish something that does not pass what `main` passes.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  plan:
    name: Plan release
    needs: check
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
      - id: plan
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: Build (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: swatinem/rust-cache@v2
      - name: Install cargo-dist
        run: ${{ matrix.install_dist.run }}
      - name: Build artifacts
        run: |
          dist build --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
            target/distrib/*-dist-manifest.json

  build-global-artifacts:
    name: Build installers
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build global artifacts
        run: |
          dist build --output-format=json "--artifacts=global" > dist-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            target/distrib/*-installer.sh
            target/distrib/*.rb
            target/distrib/*-npm-package.tar.gz
            target/distrib/*-dist-manifest.json

  host:
    name: Publish GitHub release
    needs: [plan, build-local-artifacts, build-global-artifacts]
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dist host --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"

  publish-homebrew:
    name: Publish to the Homebrew tap
    needs: host
    runs-on: ubuntu-latest
    env:
      # A fine-grained PAT with contents:write on sezeryavuz/homebrew-tap ONLY.
      GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Push the formula
        run: |
          brew tap sezeryavuz/homebrew-tap
          brew bump-formula-pr --no-browse --no-audit \
            --version="${GITHUB_REF_NAME#v}" sezeryavuz/homebrew-tap/reporch

  publish-crates-io:
    name: Publish to crates.io
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Order matters: dependencies before dependents, or the publish fails on a missing version.
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in reporch-core reporch-store reporch-claude reporch-git reporch-scan reporch; do
            echo "::group::publish $crate"
            cargo publish -p "$crate" --no-verify
            # crates.io needs a moment to index before the next crate can depend on it.
            sleep 45
            echo "::endgroup::"
          done

  publish-npm:
    name: Publish the npm shim
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tar -xzf target/distrib/*-npm-package.tar.gz -C target/distrib/
          npm publish target/distrib/package --access public
