[package]
name = "reporch-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Claude Code process, stream, registry, and environment integration for reporch."

[dependencies]
reporch-core = { version = "0.1.0", path = "../reporch-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
