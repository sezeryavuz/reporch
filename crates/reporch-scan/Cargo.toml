[package]
name = "reporch-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fast repository discovery, caching, and relevance ranking for reporch."

[dependencies]
# 0.4.30 adopted let-chains (Rust 1.88) without declaring that MSRV. Keep the
# published library compatible with the workspace's Rust 1.85 contract.
ignore = "=0.4.33"
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"

[dev-dependencies]
reporch-store = { version = "0.1.0", path = "../reporch-store" }
tempfile = "3.27.0"
