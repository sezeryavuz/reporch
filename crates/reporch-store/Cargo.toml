[package]
name = "reporch-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Atomic on-disk state, configuration, and mailbox storage for reporch."

[dependencies]
fs4 = "1.1.0"
jiff = "0.2.35"
reporch-core = { version = "0.1.0", path = "../reporch-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"

[dev-dependencies]
insta = "1.48.0"
